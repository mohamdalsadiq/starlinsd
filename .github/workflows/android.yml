name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android SDK packages
      run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

    - name: Generate debug.keystore
      run: |
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"

    - name: Test, lint, and build Debug APK
      run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace

    - name: Summarize verification and render preview
      if: always()
      run: |
        python - <<'PYCODE'
        import base64, pathlib, xml.etree.ElementTree as ET
        for p in pathlib.Path('app/build/test-results').rglob('TEST-*.xml'):
            suite = ET.parse(p).getroot()
            print('TEST_SUMMARY', suite.attrib)
            for failure in suite.findall('.//failure'):
                print('TEST_FAILURE', (failure.text or '')[:4000])
        for p in pathlib.Path('app/build/reports/ui').glob('*.png'):
            print('UI_PREVIEW_BASE64', p.name, base64.b64encode(p.read_bytes()).decode())
        for p in pathlib.Path('app/schemas').rglob('*.json'):
            print('ROOM_SCHEMA_BASE64', str(p), base64.b64encode(p.read_bytes()).decode())
        PYCODE

    - name: Upload verification reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: verification-reports
        if-no-files-found: ignore
        path: |
          app/build/reports/
          app/build/test-results/
          app/schemas/

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
